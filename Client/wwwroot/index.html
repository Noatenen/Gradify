<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Motiva</title>
    <base href="/" />
    <!-- Favicon. The href is BASE-RELATIVE on purpose: a leading slash would
         resolve against the origin and 404 under an IIS sub-path deployment,
         while this resolves against <base href> and is correct at "/" and
         under any prefix. Same rule as every other client path. -->
    <link rel="icon" type="image/png" href="images/branding/motiva-favicon.png" />
    <!-- Assistant font — the shared UI face -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Heebo — the Motiva System Master's canonical UI face. Loaded
         alongside Assistant, not instead of it: Assistant remains the face
         for Mentor / Lecturer / Staff / Admin and for the auth pages.
         Heebo is selected only inside the `.motiva-student` scope (see
         motiva-tokens.css / motiva-base.css), which nothing carries until
         Phase 2. Weights match the Master's own import. -->
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="css/bootstrap/bootstrap.min.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />
    <link href="css/gradify-theme.css" rel="stylesheet" />
    <!-- Motiva design-system foundations (Phase 2): tokens + base styles.
         Loaded after gradify-theme.css (aliases its --g-* tokens) and
         before page-specific stylesheets (so those can still win). -->
    <link href="css/motiva-tokens.css" rel="stylesheet" />
    <link href="css/motiva-base.css" rel="stylesheet" />
    <!-- The branded Motiva loader. Global rather than a scoped .razor.css
         because the pre-boot splash in <body> below needs the identical
         rules before Blazor — and therefore CSS isolation — exists. -->
    <link href="css/motiva-loader.css" rel="stylesheet" />
    <!-- The shared authentication shell (Login + Forget Password). Global
         rather than scoped for the same reason as the sheets below it: CSS
         isolation is per component, so two pages cannot share a .razor.css.
         Every rule is qualified by `.motiva-auth` — see the file header. -->
    <link href="css/motiva-auth.css" rel="stylesheet" />
    <link href="css/forms-management.css" rel="stylesheet" />
    <link href="css/airtable-management.css" rel="stylesheet" />
    <!-- The role dashboards' shared layout system (Lecturer Home + Mentor Home).
         Global rather than scoped because Blazor CSS isolation is per component,
         so two pages cannot share a .razor.css — see the file's own header.
         Replaces css/lecturer-dashboard.css, which held one card of it. -->
    <link href="css/motiva-dashboard.css" rel="stylesheet" />
    <link href="css/motiva-calendar.css" rel="stylesheet" />
    <!-- The split request workspace, shared by the lecturer and mentor queues.
         Structure only; each page keeps its own scoped stylesheet for what is
         genuinely role-specific. -->
    <link href="css/motiva-request-workspace.css" rel="stylesheet" />

    <!-- Shared by TeamAssignmentWorkspace and AssignmentFormModal so the two
         assignment surfaces cannot drift into two dialects. Same reasoning as
         the request-workspace sheet above. -->
    <link href="css/motiva-assignment-surface.css" rel="stylesheet" />
    <link href="AuthWithAdmin.Client.styles.css" rel="stylesheet" />
    <!-- Gradify JS helpers — must load before Blazor boots -->
    <script src="js/gradify-interop.js"></script>
</head>

<body>
    <div id="app">
        <!-- Pre-boot splash. Blazor replaces the whole of #app the moment it
             starts, so this is markup only: no component, no script, nothing
             that has to survive the swap. It is the one place the loader
             cannot be <MotivaLoader />, so the geometry is repeated here
             once — deliberately, and nowhere else. Keep it byte-identical to
             Components/Feedback/MotivaLoaderMark.razor. -->
        <div class="motiva-loader motiva-loader-lg motiva-loader-boot"
             role="status" aria-live="polite" aria-busy="true">
            <svg class="motiva-loader-mark" viewBox="-52.5 -52.5 558 473" fill="none"
                 xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
                <path class="motiva-loader-path motiva-loader-blue" pathLength="1000"
                      d="M138 0L301 0A152 152 0 0 1 453 152L453 266" />
                <path class="motiva-loader-path motiva-loader-purple" pathLength="1000"
                      d="M315 368L152 368A152 152 0 0 1 0 216L0 102" />
            </svg>
            <p class="motiva-loader-label">המערכת נטענת...</p>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <!-- Pointer-aware ambient hover for interactive cards. Decorative only:
         the CSS defaults its variables, so the page is correct without it.
         Deferred so it never competes with the Blazor boot. -->
    <script src="js/motiva-hover.js" defer></script>
</body>

</html>
