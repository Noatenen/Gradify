  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

e-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Assistant';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"c0b447b8-28b8-4115-bebe-c64211726fba\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* hebrew */\n@font-face {\n  font-family: 'Assistant';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"ddf825ff-c5e5-45c2-9729-329773116dee\") format('woff2');\n  unicode-range: U+0307-0308, U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Assistant';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"f8be3327-af92-4529-a406-fee727878fa5\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Assistant';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"c0b447b8-28b8-4115-bebe-c64211726fba\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\nbody{margin:0;background:#FAF9F7;font-family:Assistant,Arial,sans-serif;-webkit-font-smoothing:antialiased;color:#1A1820}\na{color:#4F46E5}\na:hover{color:#3730A3}\nh1,h2,h3,h4{margin:0}\n.swatch{border-radius:14px;height:64px;display:flex;align-items:flex-end;padding:8px 10px;font-size:11px;font-weight:800;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.25)}\n.tok-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid rgba(26,24,32,.07);font-size:14px}\n.tok-row:last-child{border-bottom:0}\n.pill{padding:5px 12px;border-radius:999px;font-size:12px;font-weight:700}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"max-width:1080px;margin:0 auto;padding:0 40px 120px\">\n\n  <!-- COVER -->\n  <section style=\"padding:100px 0 70px\">\n    <div style=\"display:inline-flex;align-items:center;gap:10px;padding:8px 16px;border-radius:999px;background:rgba(79,70,229,.07);font-size:13px;font-weight:700;color:#4F46E5\">\n      <span style=\"width:8px;height:8px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#8B5CF6,#4F46E5);box-shadow:0 0 12px rgba(79,70,229,.6)\"><\u002Fspan>\n      MOTIVA DESIGN SYSTEM · v1.0\n    <\u002Fdiv>\n    <h1 style=\"font-size:50px;line-height:1.1;letter-spacing:-1.5px;margin:26px 0 18px;font-weight:800\">The foundation, not the wallpaper.<\u002Fh1>\n    <p style=\"font-size:18px;line-height:1.65;color:#5B5568;max-width:680px;margin:0\">This turns the <a href=\"#\">Visual Manifesto<\u002Fa>'s philosophy into tokens, materials and components — the shared vocabulary every future Motiva screen is built from. Where the manifesto was right, we specify it precisely. Where it was vague, we make a call here.<\u002Fp>\n  <\u002Fsection>\n\n  <!-- REFINEMENT NOTE -->\n  <section style=\"background:#F0EEF9;border-radius:24px;padding:32px 36px;margin-bottom:80px\">\n    <p style=\"font-size:12px;font-weight:800;letter-spacing:.1em;color:#4F46E5;margin:0 0 10px\">ONE REFINEMENT TO THE MANIFESTO<\u002Fp>\n    <p style=\"font-size:16px;line-height:1.7;color:#2A2A32;margin:0\">The manifesto named two brand hues plus an \"attention\" concept but left it loose. Locking it now: <strong>three<\u002Fstrong> semantic hues total, no more — violet (focus/action), teal (progress/done), rose (attention/blocking). Everything else, forever, is neutral ink on paper. This is the single rule most responsible for keeping Motiva from drifting back into admin-dashboard territory as the product grows.<\u002Fp>\n  <\u002Fsection>\n\n  <!-- 1. FOUNDATIONS -->\n  <h2 style=\"font-size:13px;font-weight:800;letter-spacing:.14em;color:#0D9C9A;margin:0 0 8px\">01 · FOUNDATIONS<\u002Fh2>\n  <h3 style=\"font-size:32px;margin:0 0 40px;letter-spacing:-.5px\">Color<\u002Fh3>\n\n  <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px\">\n    <div class=\"swatch\" style=\"background:#4F46E5\">Violet · Focus<br>#4F46E5<\u002Fdiv>\n    <div class=\"swatch\" style=\"background:#0D9C9A\">Teal · Progress<br>#0D9C9A<\u002Fdiv>\n    <div class=\"swatch\" style=\"background:#D93864\">Rose · Attention<br>#D93864<\u002Fdiv>\n    <div class=\"swatch\" style=\"background:linear-gradient(135deg,#6D0EE6,#4F46E5,#0D9C9A)\">Ambient gradient<br>threshold-only<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-bottom:36px\">\n    <div class=\"swatch\" style=\"background:#1A1820\">Ink<br>#1A1820<\u002Fdiv>\n    <div class=\"swatch\" style=\"background:#5B5568\">Ink muted<br>#5B5568<\u002Fdiv>\n    <div class=\"swatch\" style=\"background:#8B8698\">Ink faint<br>#8B8698<\u002Fdiv>\n    <div class=\"swatch\" style=\"background:#FAF9F7;color:#8B8698;text-shadow:none;border:1px solid #E7E4EC\">Paper<br>#FAF9F7<\u002Fdiv>\n    <div class=\"swatch\" style=\"background:#FFFFFF;color:#8B8698;text-shadow:none;border:1px solid #E7E4EC\">Elevated paper<br>#FFFFFF<\u002Fdiv>\n    <div class=\"swatch\" style=\"background:#E7E4EC;color:#5B5568;text-shadow:none\">Line<br>rgba(ink,.08)<\u002Fdiv>\n  <\u002Fdiv>\n\n  <p style=\"font-size:16px;line-height:1.75;color:#3A3644;margin:0 0 12px\"><strong>Rules for using color:<\u002Fstrong> color appears on at most 2–3 elements per screen. Violet marks the thing to act on (primary button, active nav, the signature glow). Teal marks forward motion (completed steps, approvals, progress fill). Rose is reserved — it only ever means \"this is blocking you,\" never a generic warning. If a screen needs a fourth color to communicate status, it's not a color problem, it's a wording problem: say it in words.<\u002Fp>\n  <p style=\"font-size:16px;line-height:1.75;color:#3A3644;margin:0 0 70px\"><strong>Hierarchy:<\u002Fstrong> ink carries all reading. Muted ink is metadata. Color is never used for hierarchy or decoration — only for meaning that the student must act on.<\u002Fp>\n\n  <h3 style=\"font-size:32px;margin:0 0 30px;letter-spacing:-.5px\">Typography<\u002Fh3>\n  <div style=\"display:grid;gap:22px;margin-bottom:30px\">\n    <div><div style=\"font-size:40px;font-weight:800;letter-spacing:-1px;line-height:1.15\">Moment · 40/48, 800<\u002Fdiv><p style=\"font-size:13px;color:#8B8698;margin:4px 0 0\">Daily greeting, milestone names. Reads like a sentence spoken to the student.<\u002Fp><\u002Fdiv>\n    <div><div style=\"font-size:26px;font-weight:700;letter-spacing:-.4px\">Title · 26/32, 700<\u002Fdiv><p style=\"font-size:13px;color:#8B8698;margin:4px 0 0\">Page and section titles.<\u002Fp><\u002Fdiv>\n    <div><div style=\"font-size:18px;font-weight:700\">Heading · 18/24, 700<\u002Fdiv><p style=\"font-size:13px;color:#8B8698;margin:4px 0 0\">Module and card headings.<\u002Fp><\u002Fdiv>\n    <div><div style=\"font-size:16px;font-weight:500;line-height:1.6\">Body / Working voice · 16/26, 500. Dense, for lists and tasks — scans fast, no drama.<\u002Fdiv><\u002Fdiv>\n    <div><div style=\"font-size:13px;font-weight:500;color:#8B8698\">Meta / Quiet voice · 13/18, 500 — always present, never competing.<\u002Fdiv><\u002Fdiv>\n    <div><div style=\"font-size:11px;font-weight:800;letter-spacing:.12em;color:#8B8698\">LABEL / MICRO · 11PX, 800, TRACKED<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"font-size:16px;line-height:1.75;color:#3A3644;margin:0 0 70px\">One family throughout: Assistant. Hierarchy is built from the five roles above plus spacing — never from arbitrary in-between sizes. Line length for body text stays under ~70 characters; reading rhythm comes from generous line-height (1.6+) and paragraph spacing, not letter tricks.<\u002Fp>\n\n  <h3 style=\"font-size:32px;margin:0 0 24px;letter-spacing:-.5px\">Spacing &amp; Radius<\u002Fh3>\n  <div style=\"display:flex;align-items:flex-end;gap:14px;margin-bottom:16px\">\n    <div style=\"width:4px;height:4px;background:#4F46E5\"><\u002Fdiv><div style=\"width:8px;height:8px;background:#4F46E5\"><\u002Fdiv><div style=\"width:12px;height:12px;background:#4F46E5\"><\u002Fdiv><div style=\"width:16px;height:16px;background:#4F46E5\"><\u002Fdiv><div style=\"width:24px;height:24px;background:#4F46E5\"><\u002Fdiv><div style=\"width:32px;height:32px;background:#4F46E5\"><\u002Fdiv><div style=\"width:48px;height:48px;background:#4F46E5\"><\u002Fdiv><div style=\"width:64px;height:64px;background:#4F46E5\"><\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"font-size:15px;color:#5B5568;margin:0 0 30px\">4px base unit → 4·8·12·16·24·32·48·64·96. Rows use 12–16px internal padding; modules use 24–32px; page sections separate by 64–96px. Vertical rhythm &gt; horizontal density — when in doubt, add vertical space, not another border.<\u002Fp>\n  <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:70px\">\n    <div style=\"background:#fff;border:1px solid #E7E4EC;border-radius:10px;padding:16px;font-size:13px;font-weight:700\">sm · 10px<br><span style=\"font-weight:400;color:#8B8698\">inputs, tags<\u002Fspan><\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #E7E4EC;border-radius:16px;padding:16px;font-size:13px;font-weight:700\">md · 16px<br><span style=\"font-weight:400;color:#8B8698\">rows, buttons<\u002Fspan><\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #E7E4EC;border-radius:22px;padding:16px;font-size:13px;font-weight:700\">lg · 22px<br><span style=\"font-weight:400;color:#8B8698\">framed modules<\u002Fspan><\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #E7E4EC;border-radius:32px;padding:16px;font-size:13px;font-weight:700\">xl · 32px<br><span style=\"font-weight:400;color:#8B8698\">threshold hero<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n\n  <h3 style=\"font-size:32px;margin:0 0 24px;letter-spacing:-.5px\">Shadows &amp; Elevation<\u002Fh3>\n  <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:24px\">\n    <div style=\"background:#fff;border-radius:16px;padding:24px;box-shadow:0 4px 12px rgba(30,20,60,.05)\"><strong style=\"font-size:14px\">sm<\u002Fstrong><p style=\"font-size:13px;color:#8B8698;margin:6px 0 0\">rows, resting state<\u002Fp><\u002Fdiv>\n    <div style=\"background:#fff;border-radius:16px;padding:24px;box-shadow:0 10px 28px rgba(30,20,60,.08)\"><strong style=\"font-size:14px\">md<\u002Fstrong><p style=\"font-size:13px;color:#8B8698;margin:6px 0 0\">elevated modules<\u002Fp><\u002Fdiv>\n    <div style=\"background:#fff;border-radius:16px;padding:24px;box-shadow:0 20px 52px rgba(30,20,60,.12)\"><strong style=\"font-size:14px\">lg<\u002Fstrong><p style=\"font-size:13px;color:#8B8698;margin:6px 0 0\">overlays, threshold<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"font-size:15px;color:#5B5568;margin:0 0 70px\">Shadows are always cool-tinted (violet-black, never pure gray) and low-opacity. Elevation has three steps only — resting, module, overlay. Nothing sits above \"overlay\" — no double-stacked shadows.<\u002Fp>\n\n  <!-- 2. MATERIALS -->\n  <h2 style=\"font-size:13px;font-weight:800;letter-spacing:.14em;color:#0D9C9A;margin:0 0 8px\">02 · MATERIALS<\u002Fh2>\n  <h3 style=\"font-size:32px;margin:0 0 30px;letter-spacing:-.5px\">Five surfaces, each with a job<\u002Fh3>\n  <div style=\"display:grid;gap:16px;margin-bottom:70px\">\n    <div style=\"display:grid;grid-template-columns:180px 1fr;gap:20px;align-items:center;padding:20px 0;border-bottom:1px solid #E7E4EC\">\n      <div style=\"height:70px;border-radius:16px;background:linear-gradient(135deg,rgba(109,14,230,.18),rgba(13,156,154,.16))\"><\u002Fdiv>\n      <div><strong>Ambient<\u002Fstrong><p style=\"margin:4px 0 0;color:#5B5568;font-size:14px\">Threshold-only wash. Appears at login, session start, milestone/approval moments. Never behind persistent chrome.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:180px 1fr;gap:20px;align-items:center;padding:20px 0;border-bottom:1px solid #E7E4EC\">\n      <div style=\"height:70px;border-radius:16px;background:#FAF9F7;border:1px solid #E7E4EC\"><\u002Fdiv>\n      <div><strong>Paper<\u002Fstrong><p style=\"margin:4px 0 0;color:#5B5568;font-size:14px\">The default background of every workspace page. Matte, opaque, warm off-white. No blur.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:180px 1fr;gap:20px;align-items:center;padding:20px 0;border-bottom:1px solid #E7E4EC\">\n      <div style=\"height:70px;border-radius:16px;background:#fff;box-shadow:0 10px 28px rgba(30,20,60,.08)\"><\u002Fdiv>\n      <div><strong>Elevated paper<\u002Fstrong><p style=\"margin:4px 0 0;color:#5B5568;font-size:14px\">White + shadow-md. For the one or two modules per page that deserve isolation (milestone tracker, a highlighted action).<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:180px 1fr;gap:20px;align-items:center;padding:20px 0;border-bottom:1px solid #E7E4EC\">\n      <div style=\"height:70px;border-radius:16px;background:#fff;box-shadow:0 20px 52px rgba(30,20,60,.14)\"><\u002Fdiv>\n      <div><strong>Floating surface<\u002Fstrong><p style=\"margin:4px 0 0;color:#5B5568;font-size:14px\">Modals, drawers, menus. Highest elevation in the system — used sparingly, always dismissible.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:180px 1fr;gap:20px;align-items:center;padding:20px 0\">\n      <div style=\"height:70px;border-radius:16px;background:rgba(255,255,255,.6);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.8)\"><\u002Fdiv>\n      <div><strong>Glass<\u002Fstrong><p style=\"margin:4px 0 0;color:#5B5568;font-size:14px\">Rationed to one instance per screen, max: the sidebar/nav strip when it sits over an ambient threshold. Never for content surfaces — glass over text hurts legibility.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- 3. COMPONENTS -->\n  <h2 style=\"font-size:13px;font-weight:800;letter-spacing:.14em;color:#0D9C9A;margin:0 0 8px\">03 · COMPONENTS<\u002Fh2>\n  <h3 style=\"font-size:32px;margin:0 0 40px;letter-spacing:-.5px\">Visual language, piece by piece<\u002Fh3>\n\n  <div style=\"display:grid;gap:56px;margin-bottom:80px\">\n\n    <div style=\"display:grid;grid-template-columns:1.1fr .9fr;gap:32px;align-items:center\">\n      <div>\n        <strong style=\"font-size:16px\">Navigation<\u002Fstrong>\n        <p style=\"font-size:15px;line-height:1.7;color:#5B5568;margin:6px 0 0\">No background pill on the active item — just the signature glow dot beside it, plus ink weight change. The nav should look like a quiet list of destinations, not a set of buttons.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border-radius:16px;padding:10px;border:1px solid #E7E4EC\">\n        <div style=\"display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:#1A1820;font-weight:700\"><span style=\"width:7px;height:7px;border-radius:50%;background:#4F46E5;box-shadow:0 0 8px rgba(79,70,229,.6)\"><\u002Fspan>Dashboard<\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:10px;padding:10px 12px;color:#8B8698\"><span style=\"width:7px;height:7px\"><\u002Fspan>My Tasks<\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:10px;padding:10px 12px;color:#8B8698\"><span style=\"width:7px;height:7px\"><\u002Fspan>Requests<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:1.1fr .9fr;gap:32px;align-items:center\">\n      <div>\n        <strong style=\"font-size:16px\">Buttons<\u002Fstrong>\n        <p style=\"font-size:15px;line-height:1.7;color:#5B5568;margin:6px 0 0\">One primary per screen, solid violet, no gradient — gradients are ambient's territory, not a button's. Secondary is an outline on paper. Ghost for tertiary/list actions.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:10px;flex-wrap:wrap\">\n        <button style=\"border:0;background:#4F46E5;color:#fff;padding:12px 20px;border-radius:12px;font-weight:700;font-size:14px\">Primary action<\u002Fbutton>\n        <button style=\"border:1px solid #D9D5E0;background:#fff;color:#1A1820;padding:12px 20px;border-radius:12px;font-weight:700;font-size:14px\">Secondary<\u002Fbutton>\n        <button style=\"border:0;background:transparent;color:#5B5568;padding:12px 14px;border-radius:12px;font-weight:700;font-size:14px\">Ghost<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:1.1fr .9fr;gap:32px;align-items:center\">\n      <div>\n        <strong style=\"font-size:16px\">Inputs &amp; Search<\u002Fstrong>\n        <p style=\"font-size:15px;line-height:1.7;color:#5B5568;margin:6px 0 0\">Flat paper fields, 1px line border, no shadow at rest. Focus state is a 2px violet ring, not a color-fill change — keeps inputs calm until touched.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:grid;gap:10px\">\n        <div style=\"background:#fff;border:1px solid #E7E4EC;border-radius:12px;padding:12px 14px;color:#8B8698;font-size:14px\">Search tasks…<\u002Fdiv>\n        <div style=\"background:#fff;border:2px solid #4F46E5;border-radius:12px;padding:11px 13px;color:#1A1820;font-size:14px\">Focused field<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:1.1fr .9fr;gap:32px;align-items:center\">\n      <div>\n        <strong style=\"font-size:16px\">Rows (the default list unit)<\u002Fstrong>\n        <p style=\"font-size:15px;line-height:1.7;color:#5B5568;margin:6px 0 0\">Tasks, requests, notifications — all rows on one paper surface, divided by hairlines, not boxes. Status lives in text + glow, never a colored pill.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border-radius:16px;border:1px solid #E7E4EC;overflow:hidden\">\n        <div style=\"display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid #F0EEF9\"><div><strong style=\"font-size:14px\">Submission flow review<\u002Fstrong><div style=\"font-size:12px;color:#8B8698;margin-top:2px\">Google Drive link · personal task<\u002Fdiv><\u002Fdiv><span style=\"display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:#D93864\"><span style=\"width:6px;height:6px;border-radius:50%;background:#D93864\"><\u002Fspan>Overdue<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between;align-items:center;padding:16px 18px\"><div><strong style=\"font-size:14px\">Spec doc approval<\u002Fstrong><div style=\"font-size:12px;color:#8B8698;margin-top:2px\">Waiting on your reply<\u002Fdiv><\u002Fdiv><span style=\"font-size:12px;color:#8B8698;font-weight:700\">New<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:1.1fr .9fr;gap:32px;align-items:center\">\n      <div>\n        <strong style=\"font-size:16px\">Cards — reserved, not default<\u002Fstrong>\n        <p style=\"font-size:15px;line-height:1.7;color:#5B5568;margin:6px 0 0\">Only for things worth isolating: the milestone tracker, a single highlighted action, a person. One card per module, elevated-paper material.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border-radius:22px;padding:20px;box-shadow:0 10px 28px rgba(30,20,60,.08)\">\n        <strong style=\"font-size:14px\">Project milestone<\u002Fstrong>\n        <p style=\"font-size:13px;color:#8B8698;margin:4px 0 12px\">Prototype development · in progress<\u002Fp>\n        <div style=\"height:8px;background:#F0EEF9;border-radius:99px;overflow:hidden\"><div style=\"width:68%;height:100%;background:linear-gradient(90deg,#4F46E5,#0D9C9A)\"><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:1.1fr .9fr;gap:32px;align-items:center\">\n      <div>\n        <strong style=\"font-size:16px\">Timeline<\u002Fstrong>\n        <p style=\"font-size:15px;line-height:1.7;color:#5B5568;margin:6px 0 0\">Nodes, not percentages. Done = teal fill; current = signature glow ring; upcoming = quiet outline. The path is the message.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:0\">\n        <div style=\"width:28px;height:28px;border-radius:50%;background:#0D9C9A;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px\">✓<\u002Fdiv>\n        <div style=\"flex:1;height:2px;background:#0D9C9A\"><\u002Fdiv>\n        <div style=\"width:28px;height:28px;border-radius:50%;background:#fff;border:2px solid #4F46E5;box-shadow:0 0 0 4px rgba(79,70,229,.15)\"><\u002Fdiv>\n        <div style=\"flex:1;height:2px;background:#E7E4EC\"><\u002Fdiv>\n        <div style=\"width:28px;height:28px;border-radius:50%;background:#fff;border:2px solid #E7E4EC\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:1.1fr .9fr;gap:32px;align-items:center\">\n      <div>\n        <strong style=\"font-size:16px\">Tags &amp; status — no chip rainbow<\u002Fstrong>\n        <p style=\"font-size:15px;line-height:1.7;color:#5B5568;margin:6px 0 0\">Neutral tags for categories (outline, ink). The three semantic hues appear only on the small dot + word combo for real status — never as a filled colorful pill.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:8px;flex-wrap:wrap;align-items:center\">\n        <span class=\"pill\" style=\"background:#F0EEF9;color:#5B5568\">Category<\u002Fspan>\n        <span style=\"display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:#D93864\"><span style=\"width:6px;height:6px;border-radius:50%;background:#D93864\"><\u002Fspan>Blocking<\u002Fspan>\n        <span style=\"display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:#0D9C73\"><span style=\"width:6px;height:6px;border-radius:50%;background:#0D9C73\"><\u002Fspan>Approved<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:1.1fr .9fr;gap:32px;align-items:center\">\n      <div>\n        <strong style=\"font-size:16px\">Avatars, empty states &amp; notifications<\u002Fstrong>\n        <p style=\"font-size:15px;line-height:1.7;color:#5B5568;margin:6px 0 0\">Avatars: soft initials on tinted paper, no photo-frame borders. Empty states: one calm sentence, no illustration. Notifications: a row like any other — the glow dot is the only thing marking \"unread.\"<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:14px\">\n        <div style=\"width:40px;height:40px;border-radius:50%;background:#F0EEF9;color:#4F46E5;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px\">NT<\u002Fdiv>\n        <p style=\"font-size:14px;color:#8B8698;margin:0\">\"Nothing needs you today.\"<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n\n  <!-- 4. MOTION -->\n  <h2 style=\"font-size:13px;font-weight:800;letter-spacing:.14em;color:#0D9C9A;margin:0 0 8px\">04 · MOTION<\u002Fh2>\n  <h3 style=\"font-size:32px;margin:0 0 24px;letter-spacing:-.5px\">Confident, slow, never bouncy<\u002Fh3>\n  <div style=\"display:grid;grid-template-columns:repeat(2,1fr);gap:24px;font-size:15px;line-height:1.8;color:#3A3644;margin-bottom:70px\">\n    <div><strong>Timing:<\u002Fstrong> 120ms micro (hover), 200ms interaction (open/close a row), 320ms module transitions, 480–600ms ambient fades.<\u002Fdiv>\n    <div><strong>Easing:<\u002Fstrong> ease-out for anything entering, ease-in-out for ambient. No spring, no overshoot, no bounce — ever.<\u002Fdiv>\n    <div><strong>Hover:<\u002Fstrong> a 2–4% lift in ink weight or a 1px shadow increase. Never a color swap or scale-up.<\u002Fdiv>\n    <div><strong>Focus:<\u002Fstrong> 2px violet ring, offset 2px. Keyboard-visible always, not just on click.<\u002Fdiv>\n    <div><strong>Loading:<\u002Fstrong> a quiet pulse on the paper surface, not a spinner. The product waits calmly, it doesn't spin anxiously.<\u002Fdiv>\n    <div><strong>Success:<\u002Fstrong> a contained 400ms ambient bloom + signature glow on the element, then settle. Rare, so it stays meaningful.<\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- 5. ICONOGRAPHY -->\n  <h2 style=\"font-size:13px;font-weight:800;letter-spacing:.14em;color:#0D9C9A;margin:0 0 8px\">05 · ICONOGRAPHY<\u002Fh2>\n  <h3 style=\"font-size:32px;margin:0 0 24px;letter-spacing:-.5px\">One outline family, one job each<\u002Fh3>\n  <p style=\"font-size:16px;line-height:1.75;color:#3A3644;margin:0 0 70px;max-width:760px\">1.5px stroke, rounded caps and joins, drawn on a 24px grid, single weight throughout. The signature glow dot is the <em>only<\u002Fem> filled mark in the system — that contrast is what makes it read as special. Icons appear next to nav destinations and primary actions; they disappear inside dense metadata rows (a due date doesn't need a calendar glyph next to it — the word is enough). When in doubt, cut the icon before adding a second color to it.<\u002Fp>\n\n  <!-- 6. LAYOUT -->\n  <h2 style=\"font-size:13px;font-weight:800;letter-spacing:.14em;color:#0D9C9A;margin:0 0 8px\">06 · LAYOUT SYSTEM<\u002Fh2>\n  <h3 style=\"font-size:32px;margin:0 0 24px;letter-spacing:-.5px\">Same skeleton, different rhythm<\u002Fh3>\n  <p style=\"font-size:16px;line-height:1.75;color:#3A3644;margin:0 0 20px;max-width:760px\">Sidebar: fixed 248px, paper material, glass only when a threshold ambient is behind it. Workspace content caps at ~1040px so reading lines stay short. Header is a single slim row — greeting/title + 1–2 icon actions, never a second toolbar stacked under it.<\u002Fp>\n  <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:70px\">\n    <div style=\"background:#fff;border:1px solid #E7E4EC;border-radius:16px;padding:18px\"><strong style=\"font-size:14px;color:#4F46E5\">Dashboard<\u002Fstrong><p style=\"font-size:13px;color:#5B5568;margin:6px 0 0\">Widest rhythm: one milestone card + rows beneath. Ambient greeting at top. Feels like opening a daily planner.<\u002Fp><\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #E7E4EC;border-radius:16px;padding:18px\"><strong style=\"font-size:14px;color:#4F46E5\">My Tasks<\u002Fstrong><p style=\"font-size:13px;color:#5B5568;margin:6px 0 0\">Densest rhythm: grouped rows by status, tightest spacing scale, no ambient beyond the header. Feels like a productivity tool.<\u002Fp><\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #E7E4EC;border-radius:16px;padding:18px\"><strong style=\"font-size:14px;color:#4F46E5\">Requests<\u002Fstrong><p style=\"font-size:13px;color:#5B5568;margin:6px 0 0\">Conversational rhythm: taller rows with more breathing room, since each is a small exchange, not a checklist item.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- 7. PRODUCT RULES -->\n  <h2 style=\"font-size:13px;font-weight:800;letter-spacing:.14em;color:#0D9C9A;margin:0 0 8px\">07 · PRODUCT RULES<\u002Fh2>\n  <h3 style=\"font-size:32px;margin:0 0 24px;letter-spacing:-.5px\">The rulebook<\u002Fh3>\n  <ol style=\"font-size:16px;line-height:2.1;color:#2A2A32;padding-inline-start:22px;margin:0 0 90px;max-width:760px\">\n    <li>Ambient marks moments, never locations.<\u002Fli>\n    <li>One workspace per page — not a grid of competing panels.<\u002Fli>\n    <li>Rows are the default; cards are earned.<\u002Fli>\n    <li>Three semantic hues, total, forever: violet, teal, rose.<\u002Fli>\n    <li>Status is a word + the signature glow — never a colored badge rainbow.<\u002Fli>\n    <li>One icon family, outlined, one weight. No emoji, anywhere.<\u002Fli>\n    <li>No motion bounces, springs, or celebratory bursts.<\u002Fli>\n    <li>One glass surface per screen, maximum — never on a content/text surface.<\u002Fli>\n    <li>Every screen leads with \"what needs you,\" not \"what's your status.\"<\u002Fli>\n    <li>Dashboard, Tasks, Requests share materials but tune rhythm to their job.<\u002Fli>\n    <li>When unsure, remove a color or a container before adding one.<\u002Fli>\n  <\u002Fol>\n\n  <!-- CHEAT SHEET -->\n  <section style=\"background:#171526;border-radius:28px;padding:48px;color:#fff\">\n    <p style=\"font-size:12px;font-weight:800;letter-spacing:.12em;color:#B9AEFF;margin:0 0 10px\">KEEP THIS OPEN<\u002Fp>\n    <h2 style=\"font-size:26px;margin:0 0 30px;letter-spacing:-.5px\">Motiva Design Cheat Sheet<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:repeat(2,1fr);gap:36px\">\n      <div>\n        <p style=\"font-size:12px;font-weight:800;color:#7FE8DB;margin:0 0 10px\">COLOR<\u002Fp>\n        <p style=\"font-size:14px;line-height:1.8;color:rgba(255,255,255,.8);margin:0 0 20px\">Violet = act on this. Teal = moving forward. Rose = blocking. Nothing else gets color. Paper #FAF9F7, ink #1A1820.<\u002Fp>\n        <p style=\"font-size:12px;font-weight:800;color:#7FE8DB;margin:0 0 10px\">TYPE<\u002Fp>\n        <p style=\"font-size:14px;line-height:1.8;color:rgba(255,255,255,.8);margin:0 0 20px\">Assistant only. Moment / Title / Heading / Body / Meta / Label — 6 roles, no in-betweens.<\u002Fp>\n        <p style=\"font-size:12px;font-weight:800;color:#7FE8DB;margin:0 0 10px\">SPACING &amp; RADIUS<\u002Fp>\n        <p style=\"font-size:14px;line-height:1.8;color:rgba(255,255,255,.8);margin:0\">4px base scale. Radius: 10 / 16 / 22 / 32.<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <p style=\"font-size:12px;font-weight:800;color:#7FE8DB;margin:0 0 10px\">MATERIALS<\u002Fp>\n        <p style=\"font-size:14px;line-height:1.8;color:rgba(255,255,255,.8);margin:0 0 20px\">Ambient (thresholds only) → Paper (default) → Elevated paper (1–2 modules) → Floating (overlays) → Glass (rare, chrome only).<\u002Fp>\n        <p style=\"font-size:12px;font-weight:800;color:#7FE8DB;margin:0 0 10px\">COMPONENTS<\u002Fp>\n        <p style=\"font-size:14px;line-height:1.8;color:rgba(255,255,255,.8);margin:0 0 20px\">Rows by default, cards are earned. Status = word + glow dot, never a badge. One outlined icon family, no emoji.<\u002Fp>\n        <p style=\"font-size:12px;font-weight:800;color:#7FE8DB;margin:0 0 10px\">MOTION &amp; SIGNATURE<\u002Fp>\n        <p style=\"font-size:14px;line-height:1.8;color:rgba(255,255,255,.8);margin:0\">200–600ms, ease-out/in-out, never bouncy. The signature glow dot marks whatever needs attention right now — everywhere else stays quiet.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
</html>
